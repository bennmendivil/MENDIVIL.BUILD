<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MENDIVIL.BUILD | Ingeniería que construye el futuro</title>
    
    <script>
      // Anticipate the two weights that caused Web-AEC's measured layout shifts.
      if (window.location.pathname === '/web-aec') {
        for (const href of [
          '/fonts/barlow-condensed-700-latin-e3e520cb.woff2',
          '/fonts/barlow-condensed-900-latin-2036f7f4.woff2'
        ]) {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'font';
          link.type = 'font/woff2';
          link.crossOrigin = 'anonymous';
          link.href = href;
          document.head.appendChild(link);
        }
      }
    </script>
  </head>
  <body class="bg-deepBlack text-titaniumWhite font-inter antialiased selection:bg-electricBlue selection:text-titaniumWhite">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
